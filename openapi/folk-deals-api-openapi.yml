        example: Deals
        name: objectType
        in: path
      - schema:
          type: string
          minLength: 40
          maxLength: 40
        required: true
        description: The ID of the deal to update.
        name: objectId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

                  maxItems: 20
                  description: The companies associated with the deal.
                  example:
                  - id: com_92346499-30bf-4278-ae8e-4aa3ae2ace2c
                people:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 40
                        maxLength: 40
                    required:
                    - id
                    additionalProperties: false
